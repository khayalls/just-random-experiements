<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weave Light Studies</title>
<style>
  :root {
    color-scheme: dark;
    font: 14px/1.4 system-ui, sans-serif;
    background: #16161b;
    color: #f5f2fa;
  }
  body { margin: 0; }
  .study-demo { width: 100%; min-height: 100svh; }
  .study-demo section[data-variant] { height: clamp(390px, 78svh, 900px); }
  .study-demo section[hidden] { display: none; }
  .study-switcher {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px 24px;
    padding: 14px;
  }
  .study-choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .study-choices button {
    min-height: 44px;
    border: 1px solid #ffffff31;
    border-radius: 100px;
    padding: 8px 14px;
    background: transparent;
    color: inherit;
    font: inherit;
  }
  .study-choices button[aria-pressed="true"] { color: #17151f; background: #eee7fa; }
  .study-choices button:hover:not([aria-pressed="true"]) { background: #ffffff19; }
  .study-level { display: flex; align-items: center; gap: 8px; }
  .study-level input { width: 104px; accent-color: #c2a8f2; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid #a98ae1; outline-offset: 3px; }
</style>
</head>
<body>
<main class="study-demo">
<div id="weave-light-studies" aria-label="Weave light studies">
  <section class="weave-scene night" data-variant="Light on Weave" aria-label="Light on Weave">
    <canvas class="cursor-interaction" role="img" aria-label="An enlarged woven carpet with raised blue and violet threads. Light follows the pointer."></canvas>
    <div class="night-controls">
      <button type="button" class="weave-button" data-palette aria-pressed="false">Warm light</button>
      <button type="button" class="weave-button" data-effect>Sweep light <span aria-hidden="true">↗</span></button>
    </div>
  </section>
  <section class="weave-scene paper print" data-variant="Faded Print" aria-label="Faded Print" hidden>
    <canvas class="cursor-interaction" role="img" aria-label="Dusty blue and lilac halftone carpet motifs fade to white around a centered heading and at the bottom edge."></canvas>
    <div class="hero-copy">
      <h2>Patterns in<br>the making.</h2>
      <button type="button" class="weave-button" data-effect>Move the pattern <span aria-hidden="true">↗</span></button>
    </div>
  </section>
  <section class="weave-scene paper relief" data-variant="Porcelain Relief" aria-label="Porcelain Relief" hidden>
    <canvas class="cursor-interaction" role="img" aria-label="White and pearl-blue carpet ornament in a diagonal textile fold, fading into a white page."></canvas>
    <div class="hero-copy">
      <h2>Quiet<br>geometry.</h2>
      <button type="button" class="weave-button" data-effect>Shift the light <span aria-hidden="true">↗</span></button>
    </div>
  </section>
</div>

<style>
  @import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Instrument+Serif&display=swap");
  #weave-light-studies .weave-scene {
    position: relative;
    isolation: isolate;
    height: clamp(378px, 57vw, 540px);
    overflow: hidden;
    background: var(--scene-bg);
    color: var(--scene-ink);
    font-family: Geist, system-ui, sans-serif;
  }
  #weave-light-studies .weave-scene[hidden] { display: none; }
  #weave-light-studies .night {
    --scene-bg: #0b0b1c;
    --scene-ink: #f3efff;
    --button-fill: #19182bcf;
    --button-border: #c5b7ff63;
  }
  #weave-light-studies .paper {
    --scene-bg: #fff;
    --scene-ink: #202031;
    --button-fill: #fff;
    --button-border: #2323392f;
  }
  #weave-light-studies canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: pan-y;
  }
  #weave-light-studies .hero-copy {
    position: absolute;
    inset: 13% 0 auto;
    display: grid;
    justify-items: center;
    gap: 24px;
    pointer-events: none;
  }
  #weave-light-studies .relief .hero-copy {
    inset: 13% 0 auto 7%;
    justify-items: start;
  }
  #weave-light-studies h2 {
    margin: 0;
    font: 400 clamp(61px, 9.6vw, 118px)/.81 "Instrument Serif", Georgia, serif;
    letter-spacing: -.045em;
    text-align: center;
  }
  #weave-light-studies .relief h2 { text-align: left; }
  #weave-light-studies .night-controls {
    position: absolute;
    left: 18px;
    bottom: 18px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  #weave-light-studies .weave-button {
    pointer-events: auto;
    min-height: 44px;
    padding: 0 15px;
    border-radius: 50px;
    border: 1px solid var(--button-border);
    background: var(--button-fill);
    color: var(--scene-ink);
    font: 500 13px/1 Geist, system-ui, sans-serif;
  }
  #weave-light-studies .weave-button:hover,
  #weave-light-studies .weave-button[aria-pressed="true"] { border-color: currentColor; }
  #weave-light-studies .weave-button span { margin-left: 5px; }
  @media (max-width: 500px) {
    #weave-light-studies .weave-scene { height: 420px; }
    #weave-light-studies .hero-copy { inset-block-start: 15%; gap: 20px; }
    #weave-light-studies .relief .hero-copy { inset-block-start: 11%; }
    #weave-light-studies .night-controls { left: 12px; bottom: 12px; }
  }
</style>



<nav class="study-switcher" aria-label="Choose a study">
  <div class="study-choices">
    <button type="button" data-study-choice aria-pressed="true">Light on Weave</button>
    <button type="button" data-study-choice aria-pressed="false">Faded Print</button>
    <button type="button" data-study-choice aria-pressed="false">Porcelain Relief</button>
  </div>
  <label class="study-level" for="study-intensity">
    <span id="study-intensity-name">Thread sheen</span>
    <input id="study-intensity" type="range" min="0.4" max="1.6" step="0.05" value="1">
  </label>
</nav>
<script>
(() => {
  const root = document.getElementById('weave-light-studies');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const clamp = (v, low = 0, high = 1) => Math.max(low, Math.min(high, v));
  const mix = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, n) => {
    const t = clamp((n - a) / (b - a));
    return t * t * (3 - 2 * t);
  };
  const wrap = (n, m) => n - m * Math.floor(n / m);
  function grain(x, y) {
    let n = Math.imul(x + 251, 0x45d9f3b) ^ Math.imul(y + 673, 0x27d4eb2d);
    n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
    return ((n ^ (n >>> 15)) >>> 0) / 4294967296;
  }
  // Sample the same hand-drawn medallion in all three treatments.
  const tile = document.createElement('canvas');
  const side = tile.width = tile.height = 240;
  const ink = tile.getContext('2d');
  const dyes = ['#28263a','#414f70','#a94136','#d96c40','#e1ab63','#f2d3a1'];
  const colors = [[40,38,58],[65,79,112],[169,65,54],[217,108,64],[225,171,99],[242,211,161]];
  const outline = [[0,-91],[15,-91],[15,-76],[33,-57],[49,-72],[72,-72],[72,-49],[57,-33],
    [76,-15],[91,-15],[91,15],[76,15],[57,33],[72,49],[72,72],[49,72],[33,57],[15,76],[15,91],
    [-15,91],[-15,76],[-33,57],[-49,72],[-72,72],[-72,49],[-57,33],[-76,15],[-91,15],
    [-91,-15],[-76,-15],[-57,-33],[-72,-49],[-72,-72],[-49,-72],[-33,-57],[-15,-76],[-15,-91]];

  function polygon(ctx, points, fill, stroke, weight = 1) {
    ctx.beginPath();
    points.forEach(([x,y], i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = weight; ctx.stroke(); }
  }

  function diamond(ctx, size, fill, stroke, weight) {
    polygon(ctx, [[0,-size],[size,0],[0,size],[-size,0]], fill, stroke, weight);
  }

  ink.fillStyle = dyes[0];
  ink.fillRect(0,0,side,side);
  ink.translate(side / 2, side / 2);
  polygon(ink, outline, dyes[2], dyes[5], 3);
  polygon(ink, outline.map(([x,y]) => [x * .84,y * .84]), dyes[1], dyes[4], 2);
  for (let arm = 0; arm < 4; arm++) {
    ink.save();
    ink.rotate(arm * Math.PI / 2);
    polygon(ink, [[-7,-42],[-14,-55],[-14,-65],[-6,-72],[4,-72],[11,-64],[4,-57],
      [0,-61],[5,-65],[-4,-66],[-8,-62],[-8,-55],[0,-48]], dyes[5]);
    polygon(ink, [[16,-26],[39,-63],[61,-63],[61,-39],[26,-16]], dyes[2], dyes[4]);
    for (let strand = 0; strand < 5; strand++) {
      ink.beginPath();
      ink.moveTo(25 + strand * 2, -25 + strand * 1.5);
      ink.lineTo(42 + strand * 3.5, -60 + strand * 3.6);
      ink.lineWidth = 1.9;
      ink.strokeStyle = dyes[strand % 2 ? 3 : 5];
      ink.stroke();
    }
    ink.translate(88,-88);
    diamond(ink,24,dyes[2],dyes[4],2);
    for (let petal = 0; petal < 4; petal++) {
      ink.rotate(Math.PI / 2);
      polygon(ink, [[-2,-2],[-6,-9],[0,-15],[6,-9],[2,-2]], dyes[3], dyes[5], 1);
    }
    diamond(ink,4,dyes[4]);
    ink.restore();
  }
  diamond(ink,44,dyes[5],dyes[0],3);
  diamond(ink,36,dyes[2],dyes[3],2);
  diamond(ink,27,dyes[0],dyes[4],2);
  diamond(ink,18,dyes[1],dyes[5],2);
  diamond(ink,9,dyes[4],dyes[0],2);

  const pixels = ink.getImageData(0,0,side,side).data;
  const knots = new Uint8Array(side * side);
  for (let i = 0; i < knots.length; i++) {
    let nearest = Infinity;
    colors.forEach(([r,g,b], index) => {
      const offset = i * 4;
      const d = (pixels[offset]-r)**2 + (pixels[offset+1]-g)**2 + (pixels[offset+2]-b)**2;
      if (d < nearest) { nearest = d; knots[i] = index; }
    });
  }
  function sample(u,v) {
    return knots[Math.floor(wrap(v,side)) * side + Math.floor(wrap(u,side))];
  }

  const cool = [[44,40,76],[63,85,171],[108,57,154],[154,88,196],[115,154,245],[193,176,251]];
  const warm = [[51,33,29],[88,57,47],[150,61,40],[192,89,48],[205,139,78],[240,191,122]];
  const printInks = ['#8f9ebc','#718ec5','#9a75c2','#bc9dcc','#9ab7db','#c4c9e7'];
  const ordered = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  const reliefInks = ['#8c94ac','#7286b0','#786497','#9471aa','#7498bd','#788bb7'];

  function coordinates(x,y) {
    return [
      x*.89 + y*.50 + 118 + Math.sin((x+y)/35)*13 + Math.sin(y/22)*6,
      -x*.49 + y*.87 + 123,
    ];
  }

  function pattern(u,v) {
    const edge = Math.abs(wrap(v + 134,268) - 134);
    if (edge > 109) {
      if (edge > 128 || (edge > 113 && edge < 116)) return 4;
      const stair = Math.floor((edge - 116)/3) * 4;
      return wrap(u+stair,28) < 12 ? 2 : 0;
    }
    return sample(u,v);
  }

  function makeThreads(w,h) {
    const pitch = w > 650 ? 4 : 3.5;
    const scale = Math.max(w,h*1.08)/355;
    const threads = [];
    for (let row = 0, y = 0; y < h + pitch; row++, y += pitch) {
      const offset = (row % 2) * pitch * .47;
      for (let col = -1, x = offset - pitch; x < w + pitch; col++, x += pitch) {
        const xx = (x-w*.5)/scale;
        const yy = (y-h*.5)/scale;
        const [u,v] = coordinates(xx,yy);
        const index = pattern(u,v);
        const g = grain(col,row);
        const warp = (u + v*.18)/24;
        const ridge = .68 + .32 * Math.sin(warp);
        threads.push({x,y,index,g,ridge, angle: .18 * Math.cos(warp)});
      }
    }
    return {threads,pitch};
  }

  function lightPosition(w,h,aim,pulse,restX,restY) {
    const baseX = mix(w*restX,aim.x,aim.light);
    const baseY = mix(h*restY,aim.y,aim.light);
    if (!pulse) return [baseX,baseY];
    if (pulse.still) return [pulse.x,pulse.y];
    const sweep = smooth(0,.77,pulse.age);
    const fade = 1-smooth(.65,1,pulse.age);
    return [mix(baseX,mix(pulse.x,w*.82,sweep),fade), mix(baseY,mix(pulse.y,h*.38,sweep),fade)];
  }

  function weave(ctx,w,h,aim,pulse,texture,isWarm,settings) {
    ctx.fillStyle = isWarm ? '#1a110f' : '#0b0b1c';
    ctx.fillRect(0,0,w,h);
    const [lx,ly] = lightPosition(w,h,aim,pulse,.48,.43);
    const radius = Math.max(170,w*.51);
    const palette = isWarm ? warm : cool;
    const {threads,pitch} = texture;

    for (const {x,y,index,g,ridge,angle} of threads) {
      const dx = (x-lx)/radius;
      const dy = (y-ly)/(h*.67);
      const diffuse = Math.exp(-(dx*dx+dy*dy)*1.64);
      const grazing = clamp(.69 - angle*dx*1.46 + g*.24, .38,1);
      const intensity = (.24 + diffuse*1.07) * ridge * (.76 + g*.38);
      const length = pitch*(.58 + .42*g);
      const core = pitch*(.61 + .15*g);
      const [r,gc,b] = palette[index];
      const sheen = diffuse * grazing * (.26 + .18*g) * settings.intensity;
      const violet = isWarm ? 0 : .5 + .5*Math.sin(x/w*4.9 + y/h*2.4);
      ctx.fillStyle = `rgb(${(r*intensity*(1+.15*violet))|0} ${(gc*intensity)|0} ${(b*intensity)|0})`;
      ctx.fillRect(x,y+pitch*.23,length,core);
      ctx.fillStyle = `rgb(${(r*intensity+116*sheen)|0} ${(gc*intensity+132*sheen)|0} ${(b*intensity+183*sheen)|0})`;
      ctx.fillRect(x+.23,y+pitch*.16,length*(.64+g*.22),.56+g*.42);
    }
  }

  function print(ctx,w,h,aim,pulse,texture,isWarm,settings) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,w,h);
    const pitch = w < 550 ? 4.6 : 5.7;
    const centerWidth = w < 550 ? .43 : .32;
    const scale = Math.min(w/350,h/205);
    const shift = (aim.x-w*.5)*aim.light*.05;
    const nudge = pulse ? pulse.still ? 13 : Math.sin(pulse.age*Math.PI*2)*(1-pulse.age)*28 : 0;

    for (let row=0,y=pitch*.5;y<h;row++,y+=pitch) {
      const ny = y/h;
      for (let col=0,x=pitch*.5;x<w;col++,x+=pitch) {
        const nx = x/w;
        const edge = Math.abs(nx-.5);
        const clearText = mix(smooth(centerWidth*.58,centerWidth,edge),1,smooth(.56,.79,ny));
        const bottom = 1-smooth(.72,1,ny);
        const upper = smooth(-.04,.31,ny);
        const opacity = clamp(clearText*bottom*upper*settings.intensity);
        if (opacity < .013) continue;
        const px = (x-w*.50+shift+nudge)/scale;
        const py = (y-h*.55)/scale;
        const u = px*.90+py*.43+120+Math.sin(py/44)*18;
        const v = -px*.38+py*.92+160+Math.sin(px/73)*18;
        const index = pattern(u,v);
        const g = ordered[(row % 4)*4 + col % 4]/16;
        const near = aim.light*Math.exp(-((x-aim.x)**2+(y-aim.y)**2)/(h*h*.049));
        const contrast = [0.54,.79,.99,.76,.58,.67][index];
        const radius = pitch*(.12+.36*contrast) * Math.sqrt(opacity) * (.81+g*.23);
        ctx.fillStyle = printInks[index];
        ctx.globalAlpha = opacity*clamp(.68+contrast*.26+near*.2);
        ctx.beginPath();
        ctx.arc(x,y,radius,0,Math.PI*2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function makeRelief(w,h) {
    const pitch = w > 680 ? 4.1 : 3.2;
    const scale = Math.min(w/296,h/158);
    const knots = [];
    for (let row = 0, y = 0; y < h + pitch; row++, y += pitch) {
      for (let col = -1, x = -pitch + (row%2)*pitch*.47; x < w+pitch; col++, x+=pitch) {
        const nx = x/w;
        const ny = y/h;
        const fold = ny - (.93 - nx*.71 + Math.sin(nx*5.1)*.045);
        const ribbon = 1-smooth(.115,.37,Math.abs(fold));
        const right = smooth(.27,.67,nx);
        const base = (ribbon * smooth(.33,.59,ny) * .54 + ribbon*right*.62);
        const alpha = base * (1-smooth(.74,1,ny)) * smooth(.06,.27,ny);
        if (alpha < .015) continue;

        const xx = (x-w*.69)/scale;
        const yy = (y-h*.47)/scale;
        const u = xx*.83 - yy*.56 + 117;
        const v = xx*.56 + yy*.83 + 127 + 12*Math.sin(xx/39);
        const index = pattern(u,v);
        const g = grain(col,row);
        const height = [.19,.56,.83,.71,.95,1][index];
        knots.push({x,y,index,g,height,alpha: clamp(alpha), fold});
      }
    }
    return {knots,pitch};
  }

  function relief(ctx,w,h,aim,pulse,texture,isWarm,settings) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,w,h);
    const [lx,ly] = lightPosition(w,h,aim,pulse,.69,.35);
    const {knots,pitch} = texture;
    for (const {x,y,index,g,height,alpha,fold} of knots) {
      const dx = (x-lx)/Math.max(w*.46,120);
      const dy = (y-ly)/(h*.56);
      const under = Math.exp(-(dx*dx+dy*dy)*1.8);
      const roll = .72+.28*Math.cos(fold*14+dx);
      const shadow = clamp(alpha * (.09 + height*.58) * (1-under*.43) * roll * settings.intensity);
      const length = pitch*(.58+.39*g);
      ctx.globalAlpha = shadow;
      ctx.fillStyle = reliefInks[index];
      ctx.fillRect(x+dx*.73,y+pitch*.34,length,pitch*.66);
      ctx.globalAlpha = alpha*(.20+under*.58)*height;
      ctx.fillStyle = '#fff';
      ctx.fillRect(x-.2,y+.05,length*.87,Math.max(.8,pitch*.31));
    }
    ctx.globalAlpha = 1;
  }

  const styles = [
    {draw: weave, prepare: makeThreads},
    {draw: print},
    {draw: relief, prepare: makeRelief},
  ];
  [...root.querySelectorAll('.weave-scene')].forEach((scene,index) => {
    const canvas = scene.querySelector('canvas');
    const ctx = canvas.getContext('2d',{alpha:false});
    const aim = {x:0,y:0,tx:0,ty:0,light:0,on:false};
    const style = styles[index];
    const settings = {intensity:1};
    let w = 0, h = 0, raf = 0, last = 0;
    let pulse = null, texture, isWarm = false;

    function queue() {
      if (!raf && w && h && !scene.hidden) raf = requestAnimationFrame(draw);
    }

    function draw(t) {
      raf = 0;
      if (scene.hidden) return;
      const still = reduced.matches;
      const easing = still ? 1 : 1-Math.exp(-clamp(t-last,10,65)/66);
      last = t;
      aim.x = mix(aim.x,aim.tx,easing);
      aim.y = mix(aim.y,aim.ty,easing);
      const light = Number(aim.on);
      aim.light = mix(aim.light,light,easing);
      if (Math.abs(light-aim.light) < .013) aim.light = light;
      if (pulse) {
        pulse.still = still;
        pulse.age = Math.max(0,t-pulse.time)/1440;
        if (pulse.age >= 1) pulse = null;
      }
      style.draw(ctx,w,h,aim,pulse,texture,isWarm,settings);
      const isMoving = Math.hypot(aim.x-aim.tx,aim.y-aim.ty) > .42 || aim.light !== light;
      if (!still && (isMoving || pulse)) queue();
    }

    function resize() {
      if (scene.hidden) return;
      const box = canvas.getBoundingClientRect();
      if (!box.width || !box.height) return;
      w = box.width;
      h = box.height;
      const dpr = Math.min(devicePixelRatio || 1,2);
      canvas.width = Math.round(w*dpr);
      canvas.height = Math.round(h*dpr);
      ctx.setTransform(canvas.width/w,0,0,canvas.height/h,0,0);
      texture = style.prepare?.(w,h);
      queue();
    }

    function point(event) {
      const box = canvas.getBoundingClientRect();
      return [event.clientX-box.left,event.clientY-box.top];
    }

    function activate(x,y) {
      const current = {x,y,time:performance.now(),age:0,still:reduced.matches};
      pulse = current;
      setTimeout(() => {
        if (pulse === current) { pulse = null; queue(); }
      },current.still ? 620 : 1470);
      queue();
    }

    canvas.addEventListener('pointermove',event => {
      if (event.pointerType === 'touch') return;
      const [x,y] = point(event);
      if (!aim.on && aim.light < .02) { aim.x = x; aim.y = y; }
      Object.assign(aim,{tx:x,ty:y,on:true});
      queue();
    });
    canvas.addEventListener('pointerleave',() => { aim.on = false; queue(); });
    canvas.addEventListener('click',event => activate(...point(event)));
    scene.querySelector('[data-effect]').addEventListener('click',() => activate(w*.26,h*.51));
    const paletteButton = scene.querySelector('[data-palette]');
    paletteButton?.addEventListener('click',() => {
      isWarm = !isWarm;
      paletteButton.setAttribute('aria-pressed',String(isWarm));
      canvas.setAttribute('aria-label', isWarm
        ? 'An enlarged woven carpet with raised amber threads. Light follows the pointer.'
        : 'An enlarged woven carpet with raised blue and violet threads. Light follows the pointer.');
      queue();
    });
    new ResizeObserver(resize).observe(canvas);
    reduced.addEventListener('change',queue);
    resize();
    const intensity = document.getElementById('study-intensity');
    const intensityName = document.getElementById('study-intensity-name');
    document.addEventListener('studychange', () => {
      if (scene.hidden) return;
      intensity.value = String(settings.intensity);
      intensityName.textContent = ['Thread sheen','Print density','Relief contrast'][index];
    });
    intensity.addEventListener('input', () => {
      if (scene.hidden) return;
      settings.intensity = Number(intensity.value);
      queue();
    });
  });
})();
</script>
<script>
(() => {
  const sections = [...document.querySelectorAll('[data-variant]')];
  const choices = [...document.querySelectorAll('[data-study-choice]')];
  choices.forEach((button, index) => {
    button.addEventListener('click', () => {
      sections.forEach((section, i) => { section.hidden = i !== index; });
      choices.forEach((choice, i) => choice.setAttribute('aria-pressed', String(i === index)));
      document.dispatchEvent(new Event('studychange'));
    });
  });
})();
</script>

</main>
</body>
