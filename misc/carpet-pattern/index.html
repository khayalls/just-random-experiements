<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carpet Pattern</title>
<style>
  :root {
    color-scheme: light dark;
    --background: light-dark(#f5f2eb, #13131b);
    --foreground: light-dark(#201e27, #efe8de);
    --blue: light-dark(#2e5bcb, #779dff);
    --viz-series-1: var(--blue);
    background: var(--background);
    color: var(--foreground);
    font: 15px/1.4 system-ui, sans-serif;
  }
  body { margin: 0; }
  .demo { min-height: 100svh; display: grid; align-items: center; }
  .demo > div { min-width: 0; }
  .viz-row { display: flex; }
  .btn {
    background: transparent;
    color: inherit;
    border: 1px solid color-mix(in srgb, currentColor 24%, transparent);
    border-radius: 99px;
    padding: 10px 16px;
    min-height: 44px;
    font: inherit;
  }
  .btn:hover { background: color-mix(in srgb, currentColor 9%, transparent); }
  .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  .cursor-interaction, button { cursor: pointer; }
  .demo #carpet-pattern canvas { height: max(320px, calc(100svh - 64px)); }
  .demo #pixel-hands canvas { height: max(210px, calc(100svh - 64px)); }
</style>
</head>
<body>
<main class="demo">
<div id="carpet-pattern">
  <canvas class="cursor-interaction" role="img" aria-label="Red, gold, and cream carpet motifs on a midnight-blue background. Move the pointer to sweep light across the pattern. Click or tap to send a ripple."></canvas>
  <div class="viz-row carpet-controls">
    <button class="btn btn-ghost" type="button">Send a ripple</button>
  </div>
</div>

<style>
  #carpet-pattern canvas {
    display: block;
    width: 100%;
    height: clamp(330px, 57vw, 570px);
    touch-action: pan-y;
  }
  #carpet-pattern .carpet-controls {
    justify-content: center;
    padding-block: 8px 4px;
  }
</style>

<script>
(() => {
  const root = document.getElementById('carpet-pattern');
  const canvas = root.querySelector('canvas');
  const view = canvas.getContext('2d', { alpha: false });
  const art = document.createElement('canvas');
  const pen = art.getContext('2d', { alpha: false, willReadFrequently: true });
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const dark = matchMedia('(prefers-color-scheme: dark)');

  const wool = {
    field: '#151a2a', night: '#11111c', shadow: '#202133',
    wine: '#662b30', red: '#a04436',
    coral: '#c35b45', clay: '#9d5b3b', ochre: '#ca9458',
    gold: '#e1b778', ivory: '#e7cfab', blue: '#3b526b',
    indigo: '#344057',
  };

  let width = 0;
  let height = 0;
  let ratio = 1;
  let frame = 0;
  let vignette;
  let ambientShade;
  let pulse = null;
  const pointer = { active: false, x: 0, y: 0, goalX: 0, goalY: 0, light: 0 };

  function shape(points, fill, stroke, lineWidth = 1) {
    pen.beginPath();
    points.forEach(([x, y], i) => i ? pen.lineTo(x, y) : pen.moveTo(x, y));
    pen.closePath();
    if (fill) {
      pen.fillStyle = fill;
      pen.fill();
    }
    if (stroke) {
      pen.lineWidth = lineWidth;
      pen.strokeStyle = stroke;
      pen.stroke();
    }
  }

  function line(points, color, weight) {
    pen.beginPath();
    points.forEach(([x, y], i) => i ? pen.lineTo(x, y) : pen.moveTo(x, y));
    pen.lineWidth = weight;
    pen.strokeStyle = color;
    pen.stroke();
  }

  function at(x, y, scale, draw, angle = 0) {
    pen.save();
    pen.translate(x, y);
    pen.rotate(angle);
    pen.scale(scale, scale);
    draw();
    pen.restore();
  }

  function diamond(size, fill, stroke, weight) {
    shape([[0, -size], [size, 0], [0, size], [-size, 0]], fill, stroke, weight);
  }

  function rosette(main, inner) {
    for (let arm = 0; arm < 8; arm++) {
      at(0, 0, 1, () => {
        shape([[-2, -4], [-7, -10], [-7, -17], [-3, -17], [-3, -22], [3, -22],
          [3, -17], [7, -17], [7, -10], [2, -4]], main, wool.ivory, 0.8);
        line([[0, -8], [0, -17]], inner, 1.3);
      }, arm * Math.PI / 4);
    }
    diamond(6, wool.night, wool.gold, 1);
    diamond(2.2, inner);
  }

  function medallion(main, secondary, small = false) {
    const outline = [[0, -126], [12, -126], [12, -108], [30, -91], [53, -111],
      [91, -111], [110, -91], [110, -53], [91, -30], [108, -12], [126, -12],
      [126, 12], [108, 12], [91, 30], [110, 53], [110, 91], [91, 110],
      [53, 110], [30, 91], [12, 108], [12, 126], [-12, 126], [-12, 108],
      [-30, 91], [-53, 110], [-91, 110], [-110, 91], [-110, 53], [-91, 30],
      [-108, 12], [-126, 12], [-126, -12], [-108, -12], [-91, -30], [-110, -53],
      [-110, -91], [-91, -111], [-53, -111], [-30, -91], [-12, -108], [-12, -126]];
    shape(outline, wool.night, wool.ivory, 2);
    at(0, 0, 0.944, () => shape(outline, main, wool.night, 2.1));
    at(0, 0, 0.83, () => shape(outline, wool.indigo, wool.gold, 1.3));

    for (let arm = 0; arm < 4; arm++) {
      at(0, 0, 1, () => {
        shape([[22, -33], [64, -87], [91, -87], [91, -59], [35, -20]], secondary, wool.night, 2);
        for (let stripe = 0; stripe < 6; stripe++) {
          line([[26 + stripe * 2.3, -34 + stripe * 2.1], [63 + stripe * 4.9, -86 + stripe * 4.9]],
            stripe % 2 ? wool.gold : wool.ivory, 1.3);
        }
        line([[-8, -48], [-8, -72], [-21, -84], [-21, -95], [-11, -95], [-11, -86]], wool.night, 6);
        line([[-8, -48], [-8, -72], [-21, -84], [-21, -95], [-11, -95], [-11, -86]], wool.ivory, 2.3);
        line([[8, -48], [8, -72], [21, -84], [21, -95], [11, -95], [11, -86]], wool.ivory, 2.3);
        at(0, -70, 0.45, () => diamond(12, wool.gold, wool.night, 1.8));
      }, arm * Math.PI / 2);
    }

    diamond(59, wool.wine, wool.night, 2.6);
    diamond(53, wool.gold, wool.ivory, 1.5);
    diamond(44, wool.blue, wool.night, 3);
    diamond(34, wool.night, wool.ivory, 1.5);
    at(0, 0, small ? 0.88 : 1.03, () => rosette(small ? wool.blue : wool.red, wool.gold));
  }

  function hook(x, y, scale, angle, mirrored, color) {
    at(x, y, scale, () => {
      pen.scale(mirrored ? -1 : 1, 1);
      const points = [[-38, 23], [-27, 34], [-16, 34], [29, -11], [29, -29],
        [11, -29], [2, -20], [11, -11], [17, -17]];
      line(points, wool.night, 13);
      line(points, wool.ivory, 10);
      line(points, color, 6);
      for (let i = 0; i < 3; i++) {
        line([[-19 + i * 8, 22 - i * 8], [6 + i * 8, 22 - i * 8]], wool.gold, 2);
      }
      at(-24, -8, 0.58, () => rosette(wool.wine, wool.gold));
    }, angle);
  }

  function rails(w, h) {
    const rim = 9;
    const bands = [[2, 2, wool.ivory], [6, 5, wool.wine], [10, 2, wool.gold],
      [21, 20, wool.night], [32, 2, wool.gold], [36, 5, wool.red], [41, 1.2, wool.ivory]];
    bands.forEach(([inset, weight, color]) => {
      pen.strokeStyle = color;
      pen.lineWidth = weight;
      pen.strokeRect(inset, inset, w - inset * 2, h - inset * 2);
    });

    function braid(length) {
      const count = Math.max(1, Math.round((length - 2 * rim) / 29));
      const pitch = (length - 2 * rim) / count;
      for (let i = 1; i < count - 1; i++) {
        at(rim + (i + 0.5) * pitch, 21, 0.83, () => {
          pen.scale(i % 2 ? -1 : 1, 1);
          shape([[-15, 8], [-9, 8], [-2, -6], [12, -6], [12, 2], [5, 2],
            [5, -1], [2, -1], [-5, 10], [-15, 10]],
            i % 3 ? wool.ivory : wool.coral, wool.ochre, 0.5);
          at(12, 6.5, 1, () => diamond(2.3, i % 3 ? wool.coral : wool.gold));
          at(-9, -5, 1, () => diamond(2.7, wool.blue, wool.ivory, 0.4));
        });
      }
    }

    braid(w);
    at(w, h, 1, () => braid(w), Math.PI);
    at(w, 0, 1, () => braid(h), Math.PI / 2);
    at(0, h, 1, () => braid(h), -Math.PI / 2);
    [[21, 21], [w - 21, 21], [w - 21, h - 21], [21, h - 21]].forEach(([x, y]) =>
      at(x, y, 0.43, () => rosette(wool.wine, wool.gold)));
  }

  function weave() {
    const { width: w, height: h } = art;
    const pixels = pen.getImageData(0, 0, w, h);
    const data = pixels.data;
    let seed = 74381;
    const thread = Math.max(1, Math.round(ratio));
    for (let y = 0; y < h; y++) {
      const row = Math.floor(y / thread);
      for (let x = 0; x < w; x++) {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        const knot = (Math.floor(x / thread) + (row % 2) * 2) % 4;
        const fibre = (knot === 0 ? 0.77 : knot === 1 ? 1.075 : 0.985);
        const warp = row % 3 === 0 ? 0.88 : 1.055;
        const light = fibre * warp * (0.91 + (seed >>> 24) / 1420);
        const p = (y * w + x) * 4;
        data[p] *= light;
        data[p + 1] *= light;
        data[p + 2] *= light;
      }
    }
    pen.putImageData(pixels, 0, 0);
  }

  function build() {
    const scale = Math.min(height / 510, width / 438);
    const w = width / scale;
    const h = height / scale;
    pen.setTransform(ratio * scale, 0, 0, ratio * scale, 0, 0);
    pen.lineJoin = 'miter';

    pen.fillStyle = wool.field;
    pen.fillRect(0, 0, w, h);
    for (let y = 60; y < h - 47; y += 16) {
      for (let x = 60; x < w - 47; x += 19) {
        at(x + (Math.floor(y / 16) % 2) * 4, y, 1, () => diamond(1.3, wool.shadow));
      }
    }
    rails(w, h);

    pen.save();
    pen.beginPath();
    pen.rect(43, 43, w - 86, h - 86);
    pen.clip();

    const midX = w / 2;
    const midY = h / 2;
    const floralCount = Math.floor((w / 2 - 59) / 48);
    for (let i = -floralCount; i <= floralCount; i++) {
      const x = midX + i * 48;
      for (const sign of [-1, 1]) {
        at(x, midY + sign * (h / 2 - 68), 0.72, () =>
          rosette(i % 3 === 0 ? wool.blue : i % 2 === 0 ? wool.wine : wool.clay, wool.gold));
        if (i < floralCount) {
          at(x + 24, midY + sign * (h / 2 - 68), 1, () => {
            diamond(3.2, wool.gold);
            at(0, 8, 0.74, () => diamond(2.3, wool.coral));
            at(0, -8, 0.74, () => diamond(2.3, wool.coral));
          });
        }
      }
    }

    for (const sign of [-1, 1]) {
      for (const side of [-1, 1]) {
        const x = midX + side * 135;
        const y = midY + sign * 107;
        hook(x, y, 0.91, sign === 1 ? Math.PI : 0, side !== sign, wool.coral);
        at(midX + side * 48, midY + sign * 145, 0.45, () => rosette(wool.red, wool.gold));
        at(midX + side * 169, midY + sign * 51, 0.34, () => rosette(wool.blue, wool.ivory));
      }
      at(midX, midY + sign * 146, 0.47, () => {
        diamond(28, wool.wine, wool.ivory, 2);
        rosette(wool.clay, wool.ivory);
      });
    }

    at(midX, midY, 1, () => medallion(wool.red, wool.wine));
    for (const side of [-1, 1]) {
      for (let offset = 307; offset <= midX - 137; offset += 260) {
        const x = midX + side * offset;
        at(x, midY, 0.9, () => medallion(wool.blue, wool.wine, true), Math.PI / 4);
        for (const sign of [-1, 1]) {
          at(x - side * 80, midY + sign * 120, 0.7, () => rosette(wool.clay, wool.ivory));
          at(x + side * 79, midY + sign * 120, 0.68, () => rosette(wool.wine, wool.gold));
          at(x, midY + sign * 142, 0.42, () => diamond(19, wool.blue, wool.ivory, 1.5));
        }
      }
      at(midX + side * 171, midY, 0.55, () => {
        diamond(26, wool.wine, wool.ivory, 1.8);
        diamond(18, wool.clay, wool.gold, 1.2);
        diamond(8, wool.indigo, wool.ivory, 1.4);
      });
    }

    pen.restore();
    weave();
  }

  function resize() {
    const bounds = canvas.getBoundingClientRect();
    if (!bounds.width || !bounds.height) return;
    width = bounds.width;
    height = bounds.height;
    ratio = Math.min(window.devicePixelRatio || 1, 2);
    art.width = canvas.width = Math.round(width * ratio);
    art.height = canvas.height = Math.round(height * ratio);
    view.setTransform(art.width / width, 0, 0, art.height / height, 0, 0);
    vignette = view.createRadialGradient(width * 0.5, height * 0.5, height * 0.16,
      width * 0.5, height * 0.5, Math.hypot(width, height) * 0.54);
    vignette.addColorStop(0, 'rgba(12, 10, 22, 0)');
    vignette.addColorStop(0.65, 'rgba(12, 10, 22, 0.22)');
    vignette.addColorStop(1, 'rgba(12, 10, 22, 0.64)');
    build();
    syncTheme();
  }

  function syncTheme() {
    ambientShade = dark.matches ? 0.07 : 0.025;
    schedule();
  }

  function schedule() {
    if (!frame && width && height) frame = requestAnimationFrame(draw);
  }

  function flash(x, y) {
    pulse = { x, y, time: performance.now() };
    schedule();
  }

  function draw(time) {
    frame = 0;
    const still = reduced.matches;
    const ease = still ? 1 : 0.18;
    pointer.x += (pointer.goalX - pointer.x) * ease;
    pointer.y += (pointer.goalY - pointer.y) * ease;
    const goalLight = Number(pointer.active);
    pointer.light += (goalLight - pointer.light) * ease;
    if (Math.abs(goalLight - pointer.light) < 0.006) pointer.light = goalLight;

    const age = pulse ? Math.max(0, time - pulse.time) : 0;
    const duration = still ? 510 : 1180;
    if (pulse && age >= duration) pulse = null;
    const strength = pulse ? (1 - age / duration) ** 1.8 : 0;

    view.drawImage(art, 0, 0, width, height);
    if (pulse && !still) {
      const radius = age * Math.max(width, height) * 0.00102;
      const rowStep = 4;
      for (let y = 1; y < height - rowStep; y += rowStep) {
        const d = Math.abs(y - pulse.y) - radius * 0.57;
        const shift = Math.sin(d / 14) * Math.exp(-Math.abs(d) / 37) * 3.2 * strength;
        if (Math.abs(shift) < 0.24) continue;
        view.drawImage(art, 0, Math.round(y * art.height / height), art.width, Math.ceil(rowStep * art.height / height),
          shift, y, width, rowStep);
      }
    }

    view.fillStyle = vignette;
    view.fillRect(0, 0, width, height);
    view.fillStyle = 'rgba(12, 10, 22, ' + ambientShade + ')';
    view.fillRect(0, 0, width, height);

    function shine(x, y, radius, energy, band) {
      const glow = view.createRadialGradient(x, y, 0, x, y, radius);
      const color = 'rgba(255, 189, 113, ';
      if (band) {
        glow.addColorStop(0, color + '0)');
        glow.addColorStop(0.66, color + '0)');
        glow.addColorStop(0.88, color + energy + ')');
      } else {
        glow.addColorStop(0, color + energy + ')');
        glow.addColorStop(0.34, color + energy * 0.54 + ')');
      }
      glow.addColorStop(1, color + '0)');
      view.fillStyle = glow;
      view.fillRect(x - radius, y - radius, radius * 2, radius * 2);
    }

    view.globalCompositeOperation = 'soft-light';
    if (pointer.light > 0.006) shine(pointer.x, pointer.y, Math.max(117, height * 0.44), pointer.light * 0.94, false);
    if (pulse) shine(pulse.x, pulse.y, still ? 128 : 40 + age * Math.max(width, height) * 0.00101, strength * 0.84, !still);
    view.globalCompositeOperation = 'source-over';

    const moving = Math.abs(pointer.goalX - pointer.x) + Math.abs(pointer.goalY - pointer.y) > 0.25;
    if (pulse || moving || goalLight !== pointer.light) schedule();
  }

  function point(event) {
    const bounds = canvas.getBoundingClientRect();
    return [event.clientX - bounds.left, event.clientY - bounds.top];
  }

  canvas.addEventListener('pointermove', (event) => {
    if (event.pointerType === 'touch') return;
    const [x, y] = point(event);
    if (!pointer.active && pointer.light < 0.01) {
      pointer.x = x;
      pointer.y = y;
    }
    Object.assign(pointer, { active: true, goalX: x, goalY: y });
    schedule();
  });
  canvas.addEventListener('pointerleave', () => {
    pointer.active = false;
    schedule();
  });
  canvas.addEventListener('click', (event) => flash(...point(event)));
  root.querySelector('button').addEventListener('click', () => flash(width / 2, height / 2));
  reduced.addEventListener('change', schedule);
  dark.addEventListener('change', syncTheme);
  new ResizeObserver(resize).observe(canvas);
  resize();
})();
</script>
</main>
</body>
</html>
